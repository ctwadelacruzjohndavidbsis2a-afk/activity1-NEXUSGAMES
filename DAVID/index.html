<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS GAMES | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
    url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&q=80");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.container{
    width:420px;
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    background:rgba(16,20,34,.8);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 30px rgba(0,191,255,.3);
}

.logo{
    text-align:center;
    font-size:35px;
    font-weight:700;
    color:#00bfff;
}

.logo span{
    color:#8a2eff;
}

.subtitle{
    text-align:center;
    color:#ccc;
    margin:10px 0 30px;
}

.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1c2436;
    color:white;
}

.input-box input::placeholder{
    color:#999;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:600;
    font-size:15px;

    background:
    linear-gradient(
    90deg,
    #00bfff,
    #8a2eff
    );
}

.login-btn:hover{
    opacity:.9;
}

.register{
    margin-top:20px;
    text-align:center;
    color:#ccc;
}

.register a{
    color:#00bfff;
    text-decoration:none;
}

</style>
</head>
<body>

<div class="container">

<div class="logo">
NEXUS <span>GAMES</span>
</div>

<div class="subtitle">
Welcome Back Gamer
</div>

<form id="loginForm">

<div class="input-box">
<input
type="email"
id="email"
placeholder="Enter your Email"
required>
</div>

<div class="input-box">
<input
type="password"
id="password"
placeholder="Enter your Password"
required>
</div>

<button
type="submit"
class="login-btn">
SIGN IN
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">
Create Account
</a>
</div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const user =
JSON.parse(
localStorage.getItem("nexusUser")
);

if(!user){
alert("Please create an account first.");
return;
}

if(
email === user.email &&
password === user.password
){

localStorage.setItem(
"loggedIn",
"true"
);

window.location.href =
"dashboard.html";

}
else{
alert("Invalid Email or Password");
}

});

</script>

</body>
</html>
